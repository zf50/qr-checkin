<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR & Barcode Check-in</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

#reader{
  width:350px;
  margin:auto;
}

#barcodeInput{
  position:absolute;
  left:-9999px;
}

#result{
  margin-top:20px;
  font-size:24px;
  font-weight:bold;
  min-height:50px;
}

.success{
  color:green;
}

.error{
  color:red;
}
</style>
</head>

<body>

<h2>QR & Barcode Check-in</h2>
  <div id="stats" style="font-size:22px;margin:15px 0;">
    <div>تم التسليم: <span id="receivedCount">0</span></div>
    <div>المتبقي: <span id="remainingCount">0</span></div>
</div>

<div id="reader"></div>

<input type="text" id="barcodeInput" autofocus>

<div id="result"></div>

<script>

let scanning = true;

const API_URL =
"https://script.google.com/macros/s/AKfycbxqCZKevTDiFZ_luenu7Anfhr3Iwsv53PrK_y-FEHaaRCM5baERdp0UMJLQTbdzCCjZ/exec";

  function loadStats(){

    fetch(API_URL + "?stats=1")
    .then(r => r.json())
    .then(data => {

        document.getElementById("receivedCount").innerText =
            data.received;

        document.getElementById("remainingCount").innerText =
            data.remaining;

    });

}
function processCode(code){

    if(!scanning) return;

    scanning = false;

    fetch(API_URL + "?id=" + encodeURIComponent(code))
    .then(r => r.text())
    .then(data => {

        const result = document.getElementById("result");

        result.innerHTML = data;
        loadStats();

        if(data.includes("✅")){
            result.className = "success";
        }else{
            result.className = "error";
        }

        document.getElementById("barcodeInput").value = "";

        setTimeout(() => {
            scanning = true;
            document.getElementById("barcodeInput").focus();
        }, 2000);

    })
    .catch(err => {

        document.getElementById("result").innerHTML =
        "❌ Connection Error";

        scanning = true;
    });
}

function onScanSuccess(decodedText){
    processCode(decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 10,
        qrbox: 250
    },
    onScanSuccess
);

const barcodeInput = document.getElementById("barcodeInput");

barcodeInput.focus();

barcodeInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        const code = barcodeInput.value.trim();

        if(code){
            processCode(code);
        }
    }

});

document.addEventListener("click", () => {
    barcodeInput.focus();
});
  loadStats();

</script>

</body>
</html>
