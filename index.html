<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR & Barcode Check-in</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

#reader{
  width:350px;
  margin:auto;
}

#barcodeInput{
  position:absolute;
  left:-9999px;
}

#result{
  margin-top:20px;
  font-size:24px;
  font-weight:bold;
  min-height:50px;
}

.success{
  color:green;
}

.error{
  color:red;
}
</style>
</head>

<body>

<h2>QR & Barcode Check-in</h2>
  <div style="margin:15px 0;">
    <button
        onclick="resetAll()"
        style="
            background:#d32f2f;
            color:white;
            border:none;
            padding:12px 25px;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        "
    >
        🔄 Reset All
    </button>
</div>
  <div id="stats" style="font-size:22px;margin:15px 0;">
    <div>تم التسليم: <span id="receivedCount">0</span></div>
    <div>المتبقي: <span id="remainingCount">0</span></div>
</div>

<div id="reader"></div>

<input type="text" id="barcodeInput" autofocus>

<div id="result"></div>

<script>

let scanning = true;

const API_URL =
"https://script.google.com/macros/s/AKfycbxqCZKevTDiFZ_luenu7Anfhr3Iwsv53PrK_y-FEHaaRCM5baERdp0UMJLQTbdzCCjZ/exec";

  function loadStats(){
    

    fetch(API_URL + "?stats=1")
    .then(r => r.json())
    .then(data => {

        document.getElementById("receivedCount").innerText =
            data.received;

        document.getElementById("remainingCount").innerText =
            data.remaining;

    });

}
  function resetAll(){

    if(!confirm("هل تريد مسح جميع بيانات الحضور؟")){
        return;
    }

    fetch(API_URL + "?reset=1")
    .then(r => r.text())
    .then(msg => {

        alert(msg);

        loadStats();

        document.getElementById("result").innerHTML = "";

    });

}
function processCode(code){

    if(!scanning) return;

    scanning = false;

    fetch(API_URL + "?id=" + encodeURIComponent(code))
    .then(r => r.text())
    .then(data => {

        const result = document.getElementById("result");

        // لو محتاج اسم
        if(data.startsWith("NEED_NAME|")){

            const id = data.split("|")[1];

            result.className = "";

            result.innerHTML = `
                <div style="font-size:22px;margin-bottom:10px;">
                    الرقم: ${id}
                </div>

                <input
                    type="text"
                    id="personName"
                    placeholder="اكتب الاسم"
                    style="font-size:22px;padding:10px;width:250px;"
                >

                <br><br>

                <button
                    id="saveBtn"
                    style="font-size:22px;padding:10px 25px;"
                >
                    حفظ
                </button>
            `;

            document.getElementById("personName").focus();

            document.getElementById("saveBtn").onclick = function(){

                const name =
                    document.getElementById("personName").value.trim();

                if(!name){
                    alert("يجب إدخال الاسم");
                    return;
                }

                fetch(
                    API_URL +
                    "?save=1&id=" +
                    encodeURIComponent(id) +
                    "&name=" +
                    encodeURIComponent(name)
                )
                .then(r => r.text())
                .then(msg => {

                    result.innerHTML = msg;

                    if(msg.includes("✅")){
                        result.className = "success";
                    }else{
                        result.className = "error";
                    }

                    loadStats();

                    setTimeout(() => {
                        scanning = true;
                        barcodeInput.focus();
                    }, 2000);

                });

            };

            return;
        }

        result.innerHTML = data;
        loadStats();

        if(data.includes("✅")){
            result.className = "success";
        }else{
            result.className = "error";
        }

        document.getElementById("barcodeInput").value = "";

        setTimeout(() => {
            scanning = true;
            barcodeInput.focus();
        }, 2000);

    })
    .catch(err => {

        document.getElementById("result").innerHTML =
        "❌ Connection Error";

        scanning = true;
    });
}

function onScanSuccess(decodedText){
    processCode(decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 10,
        qrbox: 250
    },
    onScanSuccess
);

const barcodeInput = document.getElementById("barcodeInput");

barcodeInput.focus();

barcodeInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        const code = barcodeInput.value.trim();

        if(code){
            processCode(code);
        }
    }

});

document.addEventListener("click", () => {
    barcodeInput.focus();
});
  loadStats();

</script>

</body>
</html>
